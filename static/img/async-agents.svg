<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="900" height="340" fill="transparent"/>
  <text x="30" y="28" font-size="14" font-weight="700" fill="#a78bfa">Why agents need async — don't wait on one call at a time</text>

  <!-- SYNC -->
  <text x="40" y="64" font-size="12" font-weight="700" fill="#f87171">Sync (blocking) — 3 tool calls, one after another</text>
  <rect x="40" y="76" width="150" height="34" rx="7" fill="#1e1b2e" stroke="#ef4444"/><text x="115" y="98" font-size="10" fill="#fca5a5" text-anchor="middle">call A (2s)</text>
  <rect x="200" y="76" width="150" height="34" rx="7" fill="#1e1b2e" stroke="#ef4444"/><text x="275" y="98" font-size="10" fill="#fca5a5" text-anchor="middle">call B (2s)</text>
  <rect x="360" y="76" width="150" height="34" rx="7" fill="#1e1b2e" stroke="#ef4444"/><text x="435" y="98" font-size="10" fill="#fca5a5" text-anchor="middle">call C (2s)</text>
  <text x="530" y="98" font-size="11" fill="#f87171">total ≈ 6s</text>

  <line x1="40" y1="150" x2="860" y2="150" stroke="#3f3f46"/>

  <!-- ASYNC -->
  <text x="40" y="184" font-size="12" font-weight="700" fill="#4ade80">Async (concurrent) — fire all three, await together</text>
  <rect x="40" y="196" width="150" height="34" rx="7" fill="#1e1b2e" stroke="#16a34a"/><text x="115" y="218" font-size="10" fill="#86efac" text-anchor="middle">call A (2s)</text>
  <rect x="40" y="234" width="150" height="34" rx="7" fill="#1e1b2e" stroke="#16a34a"/><text x="115" y="256" font-size="10" fill="#86efac" text-anchor="middle">call B (2s)</text>
  <rect x="40" y="272" width="150" height="34" rx="7" fill="#1e1b2e" stroke="#16a34a"/><text x="115" y="294" font-size="10" fill="#86efac" text-anchor="middle">call C (2s)</text>
  <text x="210" y="240" font-size="11" fill="#4ade80">all run at once → total ≈ 2s</text>

  <rect x="470" y="196" width="390" height="110" rx="10" fill="#15131f" stroke="#3f3f46"/>
  <text x="486" y="218" font-size="11" font-weight="700" fill="#a78bfa">Why it matters for agents</text>
  <text x="486" y="240" font-size="10" fill="#e4e4e7">Agents spend most time waiting on I/O — LLM calls,</text>
  <text x="486" y="256" font-size="10" fill="#e4e4e7">tool APIs, retrieval. async lets one agent handle many</text>
  <text x="486" y="272" font-size="10" fill="#e4e4e7">requests and fire parallel tool calls without blocking.</text>
  <text x="486" y="292" font-size="9.5" fill="#a1a1aa">Python: async def · await · asyncio.gather(...)</text>

  <text x="30" y="330" font-size="11" fill="#a1a1aa">Rule of thumb: use async for anything that waits on the network — which is almost everything an agent does.</text>
</svg>
