<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="vc-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="980" height="470" fill="transparent"/>

  <!-- left: chunks -->
  <rect x="24" y="200" width="120" height="64" rx="11" fill="#1e1b2e" stroke="#6366f1"/>
  <text x="84" y="228" font-size="13" fill="#e4e4e7" text-anchor="middle">Chunks</text>
  <text x="84" y="246" font-size="10" fill="#a1a1aa" text-anchor="middle">+ embeddings</text>

  <!-- the same interface label -->
  <text x="300" y="40" font-size="13" font-weight="700" fill="#a78bfa">Same LangChain interface · different backend</text>
  <text x="300" y="58" font-size="10.5" fill="#a1a1aa">add_documents() · similarity_search() · as_retriever()</text>

  <!-- VECTOR STORES group -->
  <rect x="210" y="74" width="300" height="150" rx="12" fill="rgba(99,102,241,0.06)" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="224" y="94" font-size="11" font-weight="700" fill="#818cf8">VECTOR STORES · local, prototyping</text>
  <g font-size="12" fill="#e4e4e7" text-anchor="middle">
    <rect x="226" y="104" width="124" height="34" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="288" y="125">FAISS</text>
    <rect x="370" y="104" width="124" height="34" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="432" y="125">ChromaDB</text>
    <rect x="226" y="150" width="124" height="34" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="288" y="171">InMemory</text>
    <rect x="370" y="150" width="124" height="34" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="432" y="171" font-size="11">(file / RAM)</text>
  </g>

  <!-- VECTOR DATABASES group -->
  <rect x="210" y="244" width="300" height="150" rx="12" fill="rgba(139,92,246,0.06)" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="224" y="264" font-size="11" font-weight="700" fill="#c4b5fd">VECTOR DATABASES · cloud, production</text>
  <g font-size="12" fill="#e4e4e7" text-anchor="middle">
    <rect x="226" y="274" width="124" height="34" rx="8" fill="#1e1b2e" stroke="#8b5cf6"/><text x="288" y="295">Pinecone</text>
    <rect x="370" y="274" width="124" height="34" rx="8" fill="#1e1b2e" stroke="#8b5cf6"/><text x="432" y="295">Astra DB</text>
    <rect x="226" y="320" width="124" height="34" rx="8" fill="#1e1b2e" stroke="#8b5cf6"/><text x="288" y="341">Qdrant</text>
    <rect x="370" y="320" width="124" height="34" rx="8" fill="#1e1b2e" stroke="#8b5cf6"/><text x="432" y="341">Weaviate</text>
  </g>

  <!-- chunks feed both groups (ingest) -->
  <line x1="144" y1="226" x2="206" y2="150" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#vc-arr)"/>
  <line x1="144" y1="238" x2="206" y2="320" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#vc-arr)"/>
  <text x="150" y="196" font-size="9.5" fill="#a1a1aa">store once</text>

  <!-- retriever hub -->
  <rect x="566" y="204" width="120" height="60" rx="11" fill="#1e1b2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="626" y="230" font-size="13" fill="#e4e4e7" text-anchor="middle">Retriever</text>
  <text x="626" y="248" font-size="10" fill="#a1a1aa" text-anchor="middle">top-k chunks</text>

  <!-- both groups converge to retriever -->
  <line x1="510" y1="149" x2="564" y2="220" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#vc-arr)"/>
  <line x1="510" y1="319" x2="564" y2="248" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#vc-arr)"/>

  <!-- retriever -> prompt -> LLM -> answer -->
  <rect x="710" y="120" width="120" height="54" rx="11" fill="#1e1b2e" stroke="#6366f1"/>
  <text x="770" y="143" font-size="12" fill="#e4e4e7" text-anchor="middle">Prompt</text>
  <text x="770" y="160" font-size="10" fill="#a1a1aa" text-anchor="middle">question + chunks</text>

  <rect x="710" y="208" width="120" height="52" rx="11" fill="#1e1b2e" stroke="#6366f1" stroke-width="1.5"/>
  <text x="770" y="238" font-size="14" fill="#e4e4e7" text-anchor="middle">LLM</text>

  <rect x="710" y="296" width="120" height="54" rx="11" fill="#1e1b2e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="770" y="320" font-size="12" fill="#86efac" text-anchor="middle">Answer</text>
  <text x="770" y="337" font-size="10" fill="#a1a1aa" text-anchor="middle">grounded + cited</text>

  <line x1="686" y1="224" x2="708" y2="160" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#vc-arr)"/>
  <line x1="770" y1="174" x2="770" y2="206" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#vc-arr)"/>
  <line x1="770" y1="260" x2="770" y2="294" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#vc-arr)"/>

  <!-- query enters retriever -->
  <text x="626" y="290" font-size="10" fill="#a1a1aa" text-anchor="middle">▲ user query embeds in</text>

  <text x="300" y="430" font-size="11" fill="#fbbf24">Whichever backend you pick, the retrieve → prompt → LLM → answer path is identical.</text>
</svg>
