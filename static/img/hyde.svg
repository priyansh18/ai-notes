<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="hy-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="transparent"/>
  <text x="30" y="28" font-size="14" font-weight="700" fill="#a78bfa">HyDE — embed a hypothetical answer, not the question</text>

  <!-- top row: the HyDE path -->
  <rect x="30" y="60" width="150" height="56" rx="10" fill="#1e1b2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="105" y="84" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700">Question</text>
  <text x="105" y="102" font-size="9.5" fill="#a1a1aa" text-anchor="middle">"What is LCEL?"</text>

  <line x1="180" y1="88" x2="248" y2="88" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#hy-arr)"/>

  <rect x="250" y="60" width="180" height="56" rx="10" fill="#15131f" stroke="#6366f1"/>
  <text x="340" y="82" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="700">LLM drafts a fake answer</text>
  <text x="340" y="100" font-size="9" fill="#a1a1aa" text-anchor="middle">"LCEL is LangChain's way to…"</text>

  <line x1="430" y1="88" x2="498" y2="88" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#hy-arr)"/>

  <rect x="500" y="60" width="150" height="56" rx="10" fill="#15131f" stroke="#6366f1"/>
  <text x="575" y="84" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="700">Embed the draft</text>
  <text x="575" y="102" font-size="9" fill="#a1a1aa" text-anchor="middle">vector of answer-like text</text>

  <line x1="650" y1="88" x2="718" y2="88" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#hy-arr)"/>

  <rect x="720" y="60" width="150" height="56" rx="10" fill="#1e1b2e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="795" y="84" font-size="11" fill="#86efac" text-anchor="middle" font-weight="700">Retrieve real docs</text>
  <text x="795" y="102" font-size="9" fill="#a1a1aa" text-anchor="middle">→ feed LLM for final answer</text>

  <!-- why it works panel -->
  <rect x="30" y="150" width="840" height="120" rx="12" fill="#15131f" stroke="#3f3f46"/>
  <text x="50" y="178" font-size="12" font-weight="700" fill="#a78bfa">Why it helps</text>
  <text x="50" y="202" font-size="11" fill="#e4e4e7">A short question and a full document live far apart in embedding space — a question looks nothing like an answer.</text>
  <text x="50" y="224" font-size="11" fill="#e4e4e7">A hypothetical answer (even if partly wrong) is written like a real document, so its vector lands</text>
  <text x="50" y="242" font-size="11" fill="#e4e4e7">much closer to the true source chunks. You retrieve with the draft's vector, then answer from the REAL docs.</text>
  <text x="50" y="262" font-size="10.5" fill="#fbbf24">Trade-off: one extra LLM call per query (latency + cost) — use it when plain retrieval keeps missing.</text>

  <text x="30" y="300" font-size="11" fill="#a1a1aa">The draft is throwaway — it's only used to produce a better search vector, never shown to the user.</text>
</svg>
