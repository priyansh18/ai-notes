<svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="hs-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="920" height="300" fill="transparent"/>
  <text x="30" y="30" font-size="14" font-weight="700" fill="#a78bfa">Hybrid search → rerank → answer</text>

  <!-- query -->
  <rect x="30" y="120" width="110" height="48" rx="10" fill="#1e1b2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="85" y="149" font-size="13" fill="#e4e4e7" text-anchor="middle">Query</text>

  <!-- two retrievers -->
  <rect x="200" y="70" width="170" height="48" rx="10" fill="#1e1b2e" stroke="#6366f1"/>
  <text x="285" y="90" font-size="12.5" fill="#e4e4e7" text-anchor="middle">Dense (FAISS)</text>
  <text x="285" y="107" font-size="10" fill="#a1a1aa" text-anchor="middle">meaning · paraphrase</text>

  <rect x="200" y="172" width="170" height="48" rx="10" fill="#1e1b2e" stroke="#6366f1"/>
  <text x="285" y="192" font-size="12.5" fill="#e4e4e7" text-anchor="middle">Sparse (BM25)</text>
  <text x="285" y="209" font-size="10" fill="#a1a1aa" text-anchor="middle">exact terms · codes</text>

  <line x1="140" y1="135" x2="196" y2="96" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#hs-arr)"/>
  <line x1="140" y1="153" x2="196" y2="194" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#hs-arr)"/>

  <!-- ensemble fuse -->
  <rect x="420" y="120" width="130" height="48" rx="10" fill="#1e1b2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="485" y="140" font-size="12.5" fill="#e4e4e7" text-anchor="middle">Ensemble</text>
  <text x="485" y="157" font-size="10" fill="#a1a1aa" text-anchor="middle">0.7 / 0.3 weights</text>
  <line x1="370" y1="94" x2="418" y2="134" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#hs-arr)"/>
  <line x1="370" y1="196" x2="418" y2="154" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#hs-arr)"/>

  <!-- rerank -->
  <rect x="600" y="120" width="130" height="48" rx="10" fill="#1e1b2e" stroke="#f59e0b"/>
  <text x="665" y="140" font-size="12.5" fill="#fbbf24" text-anchor="middle">Cross-encoder</text>
  <text x="665" y="157" font-size="10" fill="#a1a1aa" text-anchor="middle">rerank top-k → top 3</text>
  <line x1="550" y1="144" x2="598" y2="144" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#hs-arr)"/>

  <!-- LLM answer -->
  <rect x="780" y="120" width="110" height="48" rx="10" fill="#1e1b2e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="835" y="140" font-size="12.5" fill="#86efac" text-anchor="middle">LLM</text>
  <text x="835" y="157" font-size="10" fill="#a1a1aa" text-anchor="middle">answer</text>
  <line x1="730" y1="144" x2="778" y2="144" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#hs-arr)"/>

  <text x="30" y="270" font-size="11" fill="#a1a1aa">Dense + sparse cover each other's blind spots; rerank sharpens; MMR (optional) keeps results diverse.</text>
</svg>
