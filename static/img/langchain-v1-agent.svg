<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="lc-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="transparent"/>
  <text x="30" y="28" font-size="14" font-weight="700" fill="#a78bfa">LangChain v1 — create_agent wraps a model + tools, middleware wraps that</text>

  <!-- middleware outer band -->
  <rect x="40" y="60" width="620" height="250" rx="14" fill="rgba(245,158,11,0.06)" stroke="#f59e0b" stroke-dasharray="5 4"/>
  <text x="56" y="82" font-size="12" font-weight="700" fill="#fbbf24">Middleware (logging · summarization · guardrails · retries)</text>

  <!-- agent inner box -->
  <rect x="70" y="98" width="560" height="190" rx="12" fill="#15131f" stroke="#6366f1"/>
  <text x="88" y="120" font-size="12" font-weight="700" fill="#818cf8">create_agent(model, tools, system_prompt)</text>

  <!-- model -->
  <rect x="90" y="136" width="200" height="60" rx="10" fill="#1e1b2e" stroke="#6366f1"/>
  <text x="190" y="160" font-size="11.5" fill="#e4e4e7" text-anchor="middle" font-weight="700">Model</text>
  <text x="190" y="178" font-size="9" fill="#a1a1aa" text-anchor="middle">init_chat_model —</text>
  <text x="190" y="189" font-size="9" fill="#a1a1aa" text-anchor="middle">OpenAI · Gemini · Groq</text>

  <!-- tool loop -->
  <rect x="330" y="136" width="270" height="60" rx="10" fill="#1e1b2e" stroke="#6366f1"/>
  <text x="465" y="158" font-size="11.5" fill="#e4e4e7" text-anchor="middle" font-weight="700">Tool-calling loop</text>
  <text x="465" y="176" font-size="9" fill="#a1a1aa" text-anchor="middle">model requests → your code runs tool →</text>
  <text x="465" y="187" font-size="9" fill="#a1a1aa" text-anchor="middle">result back → model answers</text>

  <line x1="290" y1="166" x2="328" y2="166" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#lc-arr)"/>
  <path d="M465 196 q0 26 -140 26 q-140 0 -140 -22" fill="none" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#lc-arr)"/>

  <!-- bind_tools + structured output -->
  <rect x="90" y="232" width="230" height="44" rx="9" fill="#15131f" stroke="#52525b"/>
  <text x="205" y="252" font-size="10.5" fill="#c4b5fd" text-anchor="middle" font-weight="700">bind_tools([...])</text>
  <text x="205" y="267" font-size="9" fill="#a1a1aa" text-anchor="middle">give the model callable tools</text>

  <rect x="340" y="232" width="260" height="44" rx="9" fill="#15131f" stroke="#52525b"/>
  <text x="470" y="252" font-size="10.5" fill="#c4b5fd" text-anchor="middle" font-weight="700">with_structured_output(Schema)</text>
  <text x="470" y="267" font-size="9" fill="#a1a1aa" text-anchor="middle">Pydantic / TypedDict → typed result</text>

  <!-- output -->
  <line x1="630" y1="193" x2="700" y2="193" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#lc-arr)"/>
  <rect x="702" y="168" width="160" height="50" rx="10" fill="#1e1b2e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="782" y="190" font-size="11.5" fill="#86efac" text-anchor="middle" font-weight="700">Answer</text>
  <text x="782" y="207" font-size="9" fill="#a1a1aa" text-anchor="middle">text · tool result · typed object</text>

  <!-- message types footer -->
  <rect x="40" y="330" width="822" height="56" rx="10" fill="#15131f" stroke="#3f3f46"/>
  <text x="56" y="352" font-size="11.5" font-weight="700" fill="#a78bfa">Everything flows as Messages:</text>
  <text x="56" y="373" font-size="10.5" fill="#e4e4e7">SystemMessage (rules) · HumanMessage (input) · AIMessage (reply + tool calls) · ToolMessage (tool result)</text>

  <text x="30" y="408" font-size="11" fill="#a1a1aa">v1 idea: one create_agent call composes model + tools; structured output types the result; middleware adds cross-cutting control.</text>
</svg>
