<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="880" height="300" fill="transparent"/>

  <!-- Vector store card -->
  <rect x="30" y="30" width="380" height="240" rx="14" fill="#15131f" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="55" y="62" font-size="16" font-weight="700" fill="#a78bfa">Vector store</text>
  <text x="55" y="84" font-size="11" fill="#a1a1aa">lightweight library · single machine</text>
  <g font-size="12" fill="#e4e4e7">
    <text x="55" y="120">• KNN similarity search</text>
    <text x="55" y="146">• in-memory / local file</text>
    <text x="55" y="172">• up to ~1M vectors</text>
    <text x="55" y="198">• microsecond queries</text>
    <text x="55" y="224">• free · prototypes &amp; research</text>
  </g>
  <text x="55" y="252" font-size="11" fill="#818cf8">FAISS · Chroma · Annoy · ScaNN</text>

  <!-- Vector database card -->
  <rect x="470" y="30" width="380" height="240" rx="14" fill="#15131f" stroke="#8b5cf6" stroke-opacity="0.6"/>
  <text x="495" y="62" font-size="16" font-weight="700" fill="#c4b5fd">Vector database</text>
  <text x="495" y="84" font-size="11" fill="#a1a1aa">full DB system · distributed</text>
  <g font-size="12" fill="#e4e4e7">
    <text x="495" y="120">• filters + metadata + full CRUD</text>
    <text x="495" y="146">• replication · sharding · HA</text>
    <text x="495" y="172">• billions of vectors</text>
    <text x="495" y="198">• millisecond queries</text>
    <text x="495" y="224">• $$$ · production systems</text>
  </g>
  <text x="495" y="252" font-size="11" fill="#a78bfa">Pinecone · Qdrant · Weaviate · Milvus</text>

  <!-- center rule -->
  <text x="440" y="290" font-size="11" fill="#fbbf24" text-anchor="middle">Rule: start with a store for prototyping → graduate to a database for production scale</text>
</svg>
