<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="in-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="transparent"/>
  <text x="30" y="30" font-size="14" font-weight="700" fill="#a78bfa">Many sources → one Document format → chunks</text>

  <!-- sources -->
  <g font-size="12" fill="#e4e4e7" text-anchor="middle">
    <rect x="30" y="50" width="150" height="32" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="105" y="70">Text · TextLoader</text>
    <rect x="30" y="90" width="150" height="32" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="105" y="110">PDF · PyPDFLoader</text>
    <rect x="30" y="130" width="150" height="32" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="105" y="150">Word · Docx2txt</text>
    <rect x="30" y="170" width="150" height="32" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="105" y="190">CSV · CSVLoader</text>
    <rect x="30" y="210" width="150" height="32" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="105" y="230">JSON · JSONLoader</text>
    <rect x="30" y="250" width="150" height="32" rx="8" fill="#1e1b2e" stroke="#6366f1"/><text x="105" y="270">SQL · SQLDatabase</text>
  </g>

  <!-- converge to Document -->
  <g stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#in-arr)">
    <line x1="180" y1="66" x2="356" y2="156"/>
    <line x1="180" y1="106" x2="356" y2="160"/>
    <line x1="180" y1="146" x2="356" y2="164"/>
    <line x1="180" y1="186" x2="356" y2="168"/>
    <line x1="180" y1="226" x2="356" y2="172"/>
    <line x1="180" y1="266" x2="356" y2="176"/>
  </g>

  <rect x="360" y="138" width="180" height="56" rx="10" fill="#1e1b2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="162" font-size="13" fill="#e4e4e7" text-anchor="middle">Document</text>
  <text x="450" y="180" font-size="10" fill="#a1a1aa" text-anchor="middle">page_content + metadata</text>

  <line x1="540" y1="166" x2="588" y2="166" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#in-arr)"/>

  <rect x="592" y="138" width="150" height="56" rx="10" fill="#1e1b2e" stroke="#6366f1"/>
  <text x="667" y="162" font-size="13" fill="#e4e4e7" text-anchor="middle">Recursive split</text>
  <text x="667" y="180" font-size="10" fill="#a1a1aa" text-anchor="middle">chunks + overlap</text>

  <line x1="742" y1="166" x2="790" y2="166" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#in-arr)"/>
  <rect x="794" y="146" width="60" height="40" rx="9" fill="#1e1b2e" stroke="#16a34a"/>
  <text x="824" y="170" font-size="11" fill="#86efac" text-anchor="middle">embed</text>
</svg>
