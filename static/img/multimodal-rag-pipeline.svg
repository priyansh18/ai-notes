  <rect x="388" y="344" width="84" height="56" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <line x1="388" y1="362" x2="472" y2="362" stroke="#e2e8f0"/>
  <line x1="388" y1="380" x2="472" y2="380" stroke="#e2e8f0"/>
