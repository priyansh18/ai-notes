<svg viewBox="0 0 1360 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1360" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1e293b">Multi-modal RAG Ingestion &amp; Query Pipeline</text>

  <!-- ════ INGESTION CONTAINER ════ -->
  <rect x="30" y="78" width="1240" height="430" rx="18" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- step labels -->
  <text x="300" y="120" font-size="14" font-weight="600" fill="#2563eb">Step 1: Partition PDF</text>
  <text x="300" y="138" font-size="14" font-weight="600" fill="#2563eb">into atomic elements</text>
  <text x="560" y="120" font-size="14" font-weight="600" fill="#2563eb">Step 2: Chunk</text>
  <text x="560" y="138" font-size="14" font-weight="600" fill="#2563eb">By Title</text>
  <text x="770" y="120" font-size="14" font-weight="600" fill="#2563eb">Step 3: Summarise chunks &amp;</text>
  <text x="770" y="138" font-size="14" font-weight="600" fill="#2563eb">convert to LangChain Documents</text>
  <text x="1075" y="250" font-size="14" font-weight="600" fill="#2563eb">Step 4: Store</text>
  <text x="1075" y="268" font-size="14" font-weight="600" fill="#2563eb">in ChromaDB</text>

  <!-- Source PDF -->
  <rect x="58" y="230" width="74" height="96" rx="6" fill="#fff" stroke="#94a3b8"/>
  <line x1="68" y1="248" x2="122" y2="248" stroke="#cbd5e1"/>
  <line x1="68" y1="262" x2="122" y2="262" stroke="#cbd5e1"/>
  <line x1="68" y1="276" x2="122" y2="276" stroke="#cbd5e1"/>
