  <rect x="1095" y="614" width="34" height="16" fill="#fcd34d"/>
  <rect x="1095" y="632" width="44" height="12" fill="#f9a8d4"/>
  <rect x="1085" y="652" width="78" height="40" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <line x1="1095" y1="666" x2="1153" y2="666" stroke="#e2e8f0"/>
  <line x1="1095" y1="678" x2="1153" y2="678" stroke="#e2e8f0"/>

  <line x1="1008" y1="660" x2="1018" y2="660" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- LLM -->
  <line x1="1216" y1="650" x2="1262" y2="650" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="1290" cy="650" r="18" fill="#0d9488"/>
  <text x="1290" y="654" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">LLM</text>
