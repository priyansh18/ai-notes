  <rect x="862" y="208" width="176" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="872" y="224" font-size="8.5" fill="#334155">page_content: raw text</text>
  <text x="872" y="237" font-size="8.5" fill="#64748b">metadata: raw text</text>
  <text x="950" y="270" font-size="11" fill="#475569" text-anchor="middle">LangChain Doc 2</text>
  <rect x="862" y="278" width="176" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="872" y="294" font-size="8.5" fill="#334155">page_content: summarised content</text>
  <text x="872" y="307" font-size="8.5" fill="#64748b">metadata: raw text/tables</text>
  <text x="950" y="340" font-size="11" fill="#475569" text-anchor="middle">LangChain Doc 3</text>
  <rect x="862" y="348" width="176" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="872" y="364" font-size="8.5" fill="#334155">page_content: summarised content</text>
  <text x="872" y="377" font-size="8.5" fill="#64748b">metadata: raw text/images</text>

  <line x1="1050" y1="290" x2="1130" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ChromaDB (3 circles) -->
  <circle cx="1158" cy="290" r="18" fill="#4285f4"/>
  <circle cx="1182" cy="290" r="18" fill="#ea4335"/>
  <circle cx="1206" cy="290" r="18" fill="#fbbc05"/>

  <!-- retrieval annotations inside container -->
  <text x="660" y="492" font-size="10.5" font-weight="600" fill="#ea580c">1. Retrieve relevant docs</text>
  <text x="870" y="492" font-size="10.5" fill="#64748b">2. Return raw multi-modal docs</text>

  <!-- ════ QUERY / RETRIEVAL ROW ════ -->
  <text x="40" y="552" font-size="16" fill="#334155">Query / Retrieval</text>

  <!-- User -->
  <circle cx="960" cy="640" r="15" fill="#f59e0b"/>
  <path d="M935 678 q25 -30 50 0 z" fill="#3b82f6"/>
  <rect x="935" y="668" width="50" height="14" fill="#3b82f6"/>
  <text x="960" y="700" font-size="11" fill="#64748b" text-anchor="middle">User</text>
  <text x="1000" y="632" font-size="11" fill="#334155">User Query:</text>
  <text x="1000" y="646" font-size="11" fill="#334155">"What is RAG?"</text>

