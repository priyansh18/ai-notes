  <rect x="578" y="190" width="120" height="230" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <rect x="592" y="208" width="92" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="638" y="226" font-size="9.5" fill="#334155" text-anchor="middle">Chunk 1</text>
  <text x="638" y="239" font-size="9" fill="#64748b" text-anchor="middle">(text only)</text>
  <rect x="592" y="278" width="92" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="638" y="296" font-size="9.5" fill="#334155" text-anchor="middle">Chunk 2</text>
  <text x="638" y="309" font-size="9" fill="#64748b" text-anchor="middle">(text + table)</text>
  <rect x="592" y="348" width="92" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="638" y="366" font-size="9.5" fill="#334155" text-anchor="middle">Chunk 3</text>
  <text x="638" y="379" font-size="9" fill="#64748b" text-anchor="middle">(text + image)</text>
  <text x="578" y="438" font-size="10" fill="#64748b">Result: 40+ chunks</text>

  <!-- AI badges -->
  <circle cx="726" cy="299" r="13" fill="#16a34a"/>
  <text x="726" y="303" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
  <circle cx="726" cy="369" r="13" fill="#16a34a"/>
  <text x="726" y="373" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">AI</text>

