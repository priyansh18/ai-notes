  <text x="95" y="218" font-size="11" fill="#64748b" text-anchor="middle">Source PDF</text>
  <text x="95" y="345" font-size="10" fill="#94a3b8" text-anchor="middle">(Research Paper)</text>

  <line x1="134" y1="278" x2="196" y2="278" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- UNSTRUCTURED -->
  <rect x="198" y="250" width="76" height="58" rx="10" fill="#22c0d6"/>
  <text x="236" y="274" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">UNSTR</text>
  <text x="236" y="288" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">UCTURED</text>

  <line x1="276" y1="278" x2="330" y2="278" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

