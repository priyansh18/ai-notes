<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="lg-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="transparent"/>
  <text x="30" y="28" font-size="14" font-weight="700" fill="#a78bfa">LangGraph — a workflow as a State graph of nodes + edges</text>

  <!-- LEFT: simple conditional graph -->
  <text x="40" y="58" font-size="12" font-weight="700" fill="#818cf8">Simple graph (conditional edge)</text>

  <circle cx="90" cy="100" r="20" fill="#1e1b2e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="90" y="104" font-size="10" fill="#86efac" text-anchor="middle">START</text>
  <line x1="110" y1="100" x2="150" y2="100" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#lg-arr)"/>

  <rect x="152" y="82" width="110" height="38" rx="8" fill="#15131f" stroke="#6366f1"/>
  <text x="207" y="105" font-size="10.5" fill="#e4e4e7" text-anchor="middle">start_play</text>

  <!-- conditional -->
  <path d="M262 101 L300 101" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#lg-arr)"/>
  <polygon points="300,101 320,86 340,101 320,116" fill="#1e1b2e" stroke="#f59e0b"/>
  <text x="320" y="104" font-size="8" fill="#fbbf24" text-anchor="middle">route?</text>
  <text x="320" y="140" font-size="8.5" fill="#a1a1aa" text-anchor="middle">conditional_edges</text>

  <line x1="340" y1="95" x2="386" y2="72" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#lg-arr)"/>
  <line x1="340" y1="108" x2="386" y2="132" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#lg-arr)"/>
  <rect x="388" y="54" width="96" height="34" rx="8" fill="#15131f" stroke="#6366f1"/>
  <text x="436" y="76" font-size="10" fill="#e4e4e7" text-anchor="middle">cricket</text>
  <rect x="388" y="116" width="96" height="34" rx="8" fill="#15131f" stroke="#6366f1"/>
  <text x="436" y="138" font-size="10" fill="#e4e4e7" text-anchor="middle">badminton</text>

  <line x1="484" y1="71" x2="516" y2="95" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#lg-arr)"/>
  <line x1="484" y1="133" x2="516" y2="109" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#lg-arr)"/>
  <circle cx="540" cy="102" r="20" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="106" font-size="11" fill="#fca5a5" text-anchor="middle">END</text>

  <!-- state note -->
  <rect x="600" y="60" width="270" height="90" rx="10" fill="#15131f" stroke="#3f3f46"/>
  <text x="616" y="82" font-size="11" font-weight="700" fill="#a78bfa">State (TypedDict)</text>
  <text x="616" y="103" font-size="9.5" fill="#e4e4e7">shared dict passed to every node;</text>
  <text x="616" y="118" font-size="9.5" fill="#e4e4e7">each node returns an update that</text>
  <text x="616" y="133" font-size="9.5" fill="#e4e4e7">overrides (or reduces) a key.</text>

  <line x1="40" y1="180" x2="860" y2="180" stroke="#3f3f46" stroke-width="1"/>

  <!-- BOTTOM: tool-calling chatbot graph -->
  <text x="40" y="210" font-size="12" font-weight="700" fill="#818cf8">Tool-calling chatbot graph</text>

  <circle cx="90" cy="270" r="20" fill="#1e1b2e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="90" y="274" font-size="10" fill="#86efac" text-anchor="middle">START</text>
  <line x1="110" y1="270" x2="152" y2="270" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#lg-arr)"/>

  <rect x="154" y="248" width="170" height="46" rx="9" fill="#1e1b2e" stroke="#6366f1"/>
  <text x="239" y="270" font-size="10.5" fill="#e4e4e7" text-anchor="middle" font-weight="700">tool_calling_llm</text>
  <text x="239" y="285" font-size="8.5" fill="#a1a1aa" text-anchor="middle">llm_with_tools.invoke(state)</text>

  <!-- tools_condition -->
  <line x1="324" y1="264" x2="362" y2="264" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#lg-arr)"/>
  <polygon points="364,264 388,246 412,264 388,282" fill="#1e1b2e" stroke="#f59e0b"/>
  <text x="388" y="267" font-size="8" fill="#fbbf24" text-anchor="middle">tool call?</text>
  <text x="388" y="304" font-size="8.5" fill="#a1a1aa" text-anchor="middle">tools_condition</text>

  <!-- yes -> tools -->
  <line x1="412" y1="258" x2="470" y2="248" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#lg-arr)"/>
  <text x="440" y="238" font-size="8.5" fill="#86efac">yes</text>
  <rect x="472" y="230" width="150" height="46" rx="9" fill="#1e1b2e" stroke="#8b5cf6"/>
  <text x="547" y="250" font-size="10.5" fill="#c4b5fd" text-anchor="middle" font-weight="700">ToolNode</text>
  <text x="547" y="265" font-size="8.5" fill="#a1a1aa" text-anchor="middle">arxiv · wikipedia · tavily</text>

  <!-- tools loop back -->
  <path d="M472 268 q-120 40 -233 26" fill="none" stroke="#8b5cf6" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#lg-arr)"/>
  <text x="330" y="330" font-size="8.5" fill="#a1a1aa">result loops back to the LLM</text>

  <!-- no -> END -->
  <line x1="400" y1="282" x2="430" y2="330" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#lg-arr)"/>
  <text x="410" y="312" font-size="8.5" fill="#f87171">no</text>
  <circle cx="452" cy="345" r="20" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <text x="452" y="349" font-size="11" fill="#fca5a5" text-anchor="middle">END</text>

  <!-- messages state note -->
  <rect x="640" y="300" width="230" height="70" rx="10" fill="#15131f" stroke="#3f3f46"/>
  <text x="656" y="322" font-size="10.5" font-weight="700" fill="#a78bfa">messages state</text>
  <text x="656" y="342" font-size="9" fill="#e4e4e7">Annotated[list, add_messages]</text>
  <text x="656" y="357" font-size="9" fill="#a1a1aa">reducer appends instead of overwrite</text>

  <text x="30" y="410" font-size="11" fill="#a1a1aa">Build: StateGraph(State) → add_node / add_edge / add_conditional_edges → compile() → invoke(). Conditional edges = branching.</text>
  <text x="30" y="428" font-size="11" fill="#a1a1aa">A tool-calling agent is just this loop: LLM node ⇄ ToolNode, with tools_condition deciding when to stop.</text>
</svg>
